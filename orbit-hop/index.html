<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05060f">
<title>Orbit Hop</title>
<!-- CrazyGames SDK v3 (the only external dependency; the game also runs without it) -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
  :root {
    --cyan: #39f3ff;
    --pink: #ff4fd8;
    --yellow: #ffe45c;
    --bg: #05060f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: #e8f6ff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    touch-action: none;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas#game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ---------- Overlay obrazovky ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
    text-align: center;
  }
  .hidden { display: none !important; }

  #menu {
    cursor: pointer;
    background: radial-gradient(ellipse at center, rgba(5, 6, 15, 0.15), rgba(5, 6, 15, 0.8));
  }
  .title {
    font-size: clamp(46px, 13vw, 120px);
    font-weight: 900;
    letter-spacing: 0.06em;
    line-height: 1;
    color: #fff;
    text-shadow: 0 0 6px var(--cyan), 0 0 20px var(--cyan), 0 0 46px #1e90ff;
  }
  .title span {
    text-shadow: 0 0 6px var(--pink), 0 0 20px var(--pink), 0 0 46px #b0209a;
  }
  .subtitle {
    font-size: clamp(20px, 5vw, 30px);
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--yellow);
    text-shadow: 0 0 10px rgba(255, 228, 92, 0.8);
  }
  .hint {
    font-size: clamp(13px, 3.4vw, 17px);
    opacity: 0.75;
    max-width: 30em;
  }
  .best-line {
    font-size: clamp(15px, 3.8vw, 20px);
    color: var(--cyan);
    text-shadow: 0 0 8px rgba(57, 243, 255, 0.7);
  }
  .blink { animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }

  #pause { background: rgba(5, 6, 15, 0.6); cursor: pointer; }
  #gameover { background: rgba(5, 6, 15, 0.55); }

  .panel {
    min-width: min(320px, 86vw);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 26px 34px;
    border-radius: 18px;
    border: 2px solid rgba(57, 243, 255, 0.6);
    background: rgba(8, 12, 30, 0.8);
    box-shadow: 0 0 24px rgba(57, 243, 255, 0.35), inset 0 0 24px rgba(57, 243, 255, 0.12);
    animation: popIn 0.22s ease-out;
  }
  @keyframes popIn {
    from { transform: scale(0.85); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
  }
  .panel h2 {
    font-size: clamp(28px, 7vw, 40px);
    font-weight: 900;
    letter-spacing: 0.05em;
    color: #fff;
    text-shadow: 0 0 8px var(--pink), 0 0 22px var(--pink);
  }
  .panel .label { font-size: 14px; opacity: 0.7; letter-spacing: 0.15em; text-transform: uppercase; }
  .panel .big {
    font-size: clamp(48px, 13vw, 72px);
    font-weight: 900;
    line-height: 1;
    color: #fff;
    text-shadow: 0 0 10px var(--cyan), 0 0 26px var(--cyan);
  }
  .reason {
    font-size: 15px;
    font-weight: 700;
    color: #ff8a7a;
    text-shadow: 0 0 8px rgba(255, 90, 60, 0.6);
  }
  .stats {
    display: flex;
    gap: 18px;
    font-size: 13px;
    opacity: 0.85;
  }
  .stats b { display: block; font-size: 20px; color: #fff; }
  .record {
    font-weight: 900;
    font-size: 18px;
    letter-spacing: 0.1em;
    color: var(--yellow);
    text-shadow: 0 0 10px rgba(255, 228, 92, 0.9);
    animation: blink 0.8s ease-in-out infinite;
  }

  .btn {
    margin-top: 8px;
    padding: 14px 34px;
    border: none;
    border-radius: 999px;
    font: inherit;
    font-size: 22px;
    font-weight: 800;
    color: #051018;
    background: var(--cyan);
    box-shadow: 0 0 18px rgba(57, 243, 255, 0.7);
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.08s;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: scale(0.95); }

  /* ---------- HUD tlačítka (pravý horní roh) ---------- */
  #hud {
    position: fixed;
    z-index: 20;
    top: calc(10px + env(safe-area-inset-top));
    right: calc(10px + env(safe-area-inset-right));
    display: flex;
    gap: 10px;
  }
  .icon-btn {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 2px solid rgba(57, 243, 255, 0.65);
    background: rgba(8, 12, 30, 0.55);
    color: var(--cyan);
    box-shadow: 0 0 12px rgba(57, 243, 255, 0.35);
    cursor: pointer;
    touch-action: manipulation;
  }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn svg { width: 24px; height: 24px; pointer-events: none; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- HUD: pauza + zvuk -->
<div id="hud">
  <button id="btnPause" class="icon-btn hidden">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
  </button>
  <button id="btnSound" class="icon-btn"></button>
</div>

<!-- Úvodní obrazovka (texty doplní i18n) -->
<div id="menu" class="overlay">
  <div class="title">ORBIT <span>HOP</span></div>
  <div class="subtitle blink" data-i18n="start"></div>
  <div class="best-line" id="menuBest"></div>
  <div class="hint"><span data-i18n="hint1"></span><br><span data-i18n="hint2"></span></div>
</div>

<!-- Pauza -->
<div id="pause" class="overlay hidden">
  <div class="panel">
    <h2 data-i18n="paused"></h2>
    <button id="btnResume" class="btn" data-i18n="resume"></button>
  </div>
</div>

<!-- Konec hry -->
<div id="gameover" class="overlay hidden">
  <div class="panel">
    <h2 data-i18n="gameOver"></h2>
    <div class="reason" id="goReason"></div>
    <div class="label" data-i18n="score"></div>
    <div class="big" id="goScore">0</div>
    <div class="record hidden" id="goRecord" data-i18n="newBest"></div>
    <div class="best-line" id="goBest"></div>
    <div class="stats">
      <div><b id="goPlanets">0</b><span data-i18n="planets"></span></div>
      <div><b id="goStars">0</b><span data-i18n="stars"></span></div>
      <div><b id="goCombo">x1</b><span data-i18n="maxCombo"></span></div>
    </div>
    <button id="btnRestart" class="btn" data-i18n="playAgain"></button>
  </div>
</div>

<script>
'use strict';

/* =====================================================================
 * 1. KONFIGURACE A POMOCNÉ FUNKCE
 * ===================================================================== */
const CFG = {
  PLAY_W: 520,          // šířka hrací "šachty" ve světových jednotkách
  VIEW_H: 820,          // minimální viditelná výška ve světových jednotkách
  FLY_SPEED: 560,       // rychlost letu raketky (jednotek / s)
  COMBO_WINDOW: 1.0,    // rychlý skok = do 1 s po přistání
  MAX_MULT: 5,          // maximální násobič bodů
  MAX_FLIGHT: 4.0,      // max. doba letu, pak je raketka ztracena ve vesmíru
  STAR_POINTS: 5,
  TRAIL_LEN: 26,
  MAX_PARTICLES: 450,
  MIDGAME_EVERY: 3,     // midgame reklama po každé 3. prohře
  DYING_TIME: 0.85,     // délka animace výbuchu před game over obrazovkou
  STORAGE_BEST: 'orbitHop.best',
  STORAGE_MUTE: 'orbitHop.muted',
};

// Neonová paleta planet
const PALETTE = ['#39f3ff', '#ff4fd8', '#7cff4f', '#ffb800', '#a66bff', '#ff5e3a', '#3cffd0', '#4f8bff'];

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const hexToRgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const RGB_WHITE = [255, 255, 255];
const RGB_CYAN = hexToRgb('#39f3ff');
const RGB_PINK = hexToRgb('#ff4fd8');
const RGB_YELLOW = hexToRgb('#ffe45c');
const RGB_ORANGE = hexToRgb('#ff7a3a');

/** Exponenciální vyhlazení nezávislé na FPS. */
const smooth = (rate, dt) => 1 - Math.exp(-rate * dt);

const IS_TOUCH = (() => {
  try { return window.matchMedia('(pointer: coarse)').matches; } catch (e) { return false; }
})();

/** Krátká vibrace na mobilu (pokud je podporovaná). */
function vibrate(ms) {
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* ignorovat */ }
}


/* =====================================================================
 * 1b. LOKALIZACE – výchozí angličtina, čeština podle locale z CrazyGames SDK
 *     (nebo ?lang=cs pro lokální testování)
 * ===================================================================== */
const I18N = {
  en: {
    start: IS_TOUCH ? 'Tap to start' : 'Click to start',
    hint1: IS_TOUCH ? 'Tap to leave your orbit.' : 'Click, Space or tap to leave your orbit.',
    hint2: 'Catch the next planet and don’t drift off screen!',
    bestScore: (n) => `Best score: ${n}`,
    best: (n) => `Best: ${n}`,
    paused: 'PAUSED',
    resume: 'Resume',
    gameOver: 'GAME OVER',
    score: 'Score',
    newBest: 'NEW BEST!',
    playAgain: 'Play again',
    planets: 'planets',
    stars: 'stars',
    maxCombo: 'max combo',
    launchHint: IS_TOUCH ? 'Tap to launch!' : 'Click or press Space to launch!',
    combo: (n) => `COMBO x${n}`,
    pause: 'Pause (P / Esc)',
    soundOn: 'Mute (M)',
    soundOff: 'Unmute (M)',
    reason_side: 'You drifted off course',
    reason_bottom: 'You fell out of view',
    reason_lost: 'Lost in deep space',
    reason_asteroid: 'Hit by an asteroid',
  },
  cs: {
    start: IS_TOUCH ? 'Tapni pro start' : 'Klikni pro start',
    hint1: IS_TOUCH ? 'Tapnutím opustíš oběžnou dráhu.' : 'Klik, mezerník nebo tap = odlet z oběžné dráhy.',
    hint2: 'Chyť se další planety a nevyleť z obrazovky!',
    bestScore: (n) => `Nejlepší skóre: ${n}`,
    best: (n) => `Nejlepší: ${n}`,
    paused: 'PAUZA',
    resume: 'Pokračovat',
    gameOver: 'KONEC HRY',
    score: 'Skóre',
    newBest: 'NOVÝ REKORD!',
    playAgain: 'Hrát znovu',
    planets: 'planet',
    stars: 'hvězd',
    maxCombo: 'max. kombo',
    launchHint: IS_TOUCH ? 'Tapni pro odlet!' : 'Klikni nebo zmáčkni mezerník!',
    combo: (n) => `KOMBO x${n}`,
    pause: 'Pauza (P / Esc)',
    soundOn: 'Ztlumit (M)',
    soundOff: 'Zapnout zvuk (M)',
    reason_side: 'Vyletěl jsi z dráhy',
    reason_bottom: 'Spadl jsi mimo obrazovku',
    reason_lost: 'Ztracen v hlubokém vesmíru',
    reason_asteroid: 'Srážka s asteroidem',
  },
};

let LANG = 'en';
const URL_LANG = (() => {
  try { return new URLSearchParams(window.location.search).get('lang'); } catch (e) { return null; }
})();

/** Přeložený text; funkce v tabulce dostanou argumenty (např. skóre). */
function t(key, ...args) {
  const s = I18N[LANG][key] !== undefined ? I18N[LANG][key] : I18N.en[key];
  return typeof s === 'function' ? s(...args) : s;
}

/** Nastaví jazyk podle kódu locale ("cs-CZ" → čeština, cokoliv jiného → angličtina). */
function setLanguage(code) {
  LANG = code && String(code).toLowerCase().startsWith('cs') ? 'cs' : 'en';
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  const bp = document.getElementById('btnPause');
  bp.title = t('pause');
  bp.setAttribute('aria-label', t('pause'));
  if (typeof UI !== 'undefined') {
    UI.updateSoundIcon();
    UI.updateMenuBest();
  }
}


/* =====================================================================
 * 2. ÚLOŽIŠTĚ – CrazyGames SDK data modul (cloud pro přihlášené hráče),
 *    jinak localStorage; vše v try/catch (úložiště může být zakázané)
 * ===================================================================== */
const Store = {
  cloud: null,   // SDK.data po inicializaci SDK

  get(key, fallback) {
    try {
      if (this.cloud) {
        const v = this.cloud.getItem(key);
        if (v !== null && v !== undefined) return v;
      }
    } catch (e) { /* ignorovat */ }
    try {
      const v = window.localStorage.getItem(key);
      return v === null ? fallback : v;
    } catch (e) {
      return fallback;
    }
  },
  set(key, value) {
    try { if (this.cloud) this.cloud.setItem(key, String(value)); } catch (e) { /* ignorovat */ }
    try { window.localStorage.setItem(key, String(value)); } catch (e) { /* ignorovat */ }
  },
};


/* =====================================================================
 * 3. ZVUK (Web Audio API – všechny zvuky jsou generované)
 * ===================================================================== */
const Sound = {
  ctx: null,
  master: null,
  noiseBuf: null,
  userMuted: Store.get(CFG.STORAGE_MUTE, '0') === '1',
  adMuted: false,    // ztlumení během reklamy
  sdkMuted: false,   // ztlumení nastavené platformou CrazyGames

  isMuted() { return this.userMuted || this.adMuted || this.sdkMuted; },

  /** Vytvoří / probudí AudioContext – musí se volat z uživatelského gesta. */
  unlock() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.isMuted() ? 0 : 0.7;
        this.master.connect(this.ctx.destination);
        // 1 s bílého šumu pro výbuchy a dopady
        const len = this.ctx.sampleRate;
        this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = this.noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        this.startMusic();
      }
      if (this.ctx.state === 'suspended' && !document.hidden) this.ctx.resume();
    } catch (e) { /* audio není dostupné */ }
  },

  applyMute() {
    if (this.master) {
      this.master.gain.setTargetAtTime(this.isMuted() ? 0 : 0.7, this.ctx.currentTime, 0.02);
    }
    UI.updateSoundIcon();
  },
  toggleUserMute() {
    this.userMuted = !this.userMuted;
    Store.set(CFG.STORAGE_MUTE, this.userMuted ? '1' : '0');
    this.applyMute();
  },
  setAdMuted(v) { this.adMuted = v; this.applyMute(); },
  setSdkMuted(v) { this.sdkMuted = !!v; this.applyMute(); },

  /** Oscilátor s frekvenčním sweepem a obálkou. */
  tone(f0, f1, dur, type = 'sine', vol = 0.3, delay = 0) {
    if (!this.ctx || this.isMuted()) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(this.master);
    o.start(t);
    o.stop(t + dur + 0.03);
  },

  /** Filtrovaný šum (dopady, výbuch). */
  noise(dur, freq, vol = 0.3, delay = 0) {
    if (!this.ctx || this.isMuted()) return;
    const t = this.ctx.currentTime + delay;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = freq;
    f.Q.value = 0.8;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f);
    f.connect(g);
    g.connect(this.master);
    src.start(t);
    src.stop(t + dur + 0.03);
  },

  jump() {
    this.tone(260, 640, 0.14, 'sine', 0.25);
    this.tone(520, 1280, 0.09, 'triangle', 0.07);
  },
  land(combo) {
    // combo < 0 = přistání bez bodů (starší planeta)
    const f = combo < 0 ? 300 : 440 * (1 + combo * 0.15);
    this.tone(f, f * 0.5, 0.16, 'triangle', 0.28);
    this.noise(0.07, 2400, 0.1);
    if (combo > 0) this.tone(f * 1.5, f * 2, 0.12, 'sine', 0.12, 0.05);
  },
  star() {
    this.tone(988, 988, 0.08, 'square', 0.09);
    this.tone(1319, 1319, 0.1, 'square', 0.09, 0.07);
    this.tone(1976, 2400, 0.22, 'sine', 0.14, 0.14);
  },
  lose() {
    this.tone(440, 50, 0.7, 'sawtooth', 0.2);
    this.noise(0.55, 500, 0.4);
  },
  click() {
    this.tone(700, 900, 0.05, 'sine', 0.1);
  },
  newBest() {
    [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, f, 0.14, 'triangle', 0.14, i * 0.08));
  },

  /* ---------- Procedurální hudba (arpeggio + bas, Am–F–C–G) ----------
   * Plánovač s předstihem: každých 100 ms naplánuje noty na dalších 300 ms. */
  musicTimer: null,
  musicBus: null,
  nextNote: 0,
  step: 0,
  CHORDS: [
    { bass: 45, notes: [57, 60, 64, 69] },   // Am
    { bass: 41, notes: [53, 57, 60, 65] },   // F
    { bass: 48, notes: [55, 60, 64, 67] },   // C
    { bass: 43, notes: [55, 59, 62, 67] },   // G
  ],
  ARP: [0, 1, 2, 3, 2, 1, 2, 3],

  startMusic() {
    if (!this.ctx || this.musicTimer) return;
    this.musicBus = this.ctx.createGain();
    this.musicBus.gain.value = 0.55;
    this.musicBus.connect(this.master);
    this.nextNote = this.ctx.currentTime + 0.1;
    this.musicTimer = setInterval(() => this.scheduleMusic(), 100);
  },

  scheduleMusic() {
    if (!this.ctx || this.ctx.state !== 'running') return;
    const active = !G.adActive && G.state !== 'paused';
    const now = this.ctx.currentTime;
    // Po pauze nepřehrávat zameškané noty najednou
    if (this.nextNote < now) this.nextNote = now + 0.05;
    if (!active || this.isMuted()) {
      this.nextNote = now + 0.1;
      return;
    }
    const beat = 0.25;   // osmina při 120 BPM
    while (this.nextNote < now + 0.3) {
      const chord = this.CHORDS[Math.floor(this.step / 8) % this.CHORDS.length];
      const i = this.step % 8;
      const midiF = (m) => 440 * Math.pow(2, (m - 69) / 12);
      // arpeggio
      const f = midiF(chord.notes[this.ARP[i]] + 12);
      this.musicNote(f, beat * 0.9, 'triangle', 0.045, this.nextNote);
      // bas na 1. a 5. osmině
      if (i === 0 || i === 4) this.musicNote(midiF(chord.bass), beat * 1.8, 'sine', 0.11, this.nextNote);
      // během hry jemný hi-hat na doby, s kombem výraznější
      if (G.state === 'playing' && i % 2 === 1) this.musicHat(this.nextNote, 0.02 + Math.min(G.combo, 4) * 0.008);
      this.nextNote += beat;
      this.step++;
    }
  },

  musicNote(f, dur, type, vol, t) {
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(this.musicBus);
    o.start(t);
    o.stop(t + dur + 0.03);
  },

  musicHat(t, vol) {
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = 7000;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    src.connect(f);
    f.connect(g);
    g.connect(this.musicBus);
    src.start(t, Math.random() * 0.5);
    src.stop(t + 0.05);
  },
};


/* =====================================================================
 * 4. CRAZYGAMES SDK (všechna volání jsou chráněná – hra běží i bez SDK)
 * ===================================================================== */
const CG = {
  sdk: null,
  ready: false,
  gameplayActive: false,

  async init() {
    try {
      if (window.CrazyGames && window.CrazyGames.SDK) {
        await window.CrazyGames.SDK.init();
        this.sdk = window.CrazyGames.SDK;
        this.ready = this.sdk.environment !== 'disabled';
        if (!this.ready) return;
        // Jazyk podle locale hráče (fallback angličtina)
        try {
          const info = this.sdk.user && this.sdk.user.systemInfo;
          if (!URL_LANG && info && info.locale) setLanguage(info.locale);
        } catch (e) { /* ignorovat */ }
        // Cloudové ukládání (synchronizuje rekord pro přihlášené hráče)
        try {
          if (this.sdk.data) {
            Store.cloud = this.sdk.data;
            const cloudBest = parseInt(Store.get(CFG.STORAGE_BEST, '0'), 10) || 0;
            if (cloudBest > G.best) G.best = cloudBest;
            else if (G.best > cloudBest) Store.set(CFG.STORAGE_BEST, G.best);
            UI.updateMenuBest();
          }
        } catch (e) { /* ignorovat */ }
        // Respektovat nastavení zvuku z platformy
        try {
          const s = this.sdk.game.settings;
          if (s) Sound.setSdkMuted(s.muteAudio);
          this.sdk.game.addSettingsChangeListener((ns) => Sound.setSdkMuted(ns && ns.muteAudio));
        } catch (e) { /* starší verze SDK */ }
        // Pokud hra začala dřív, než se SDK inicializovalo, dohlásit gameplayStart
        if (this.gameplayActive) this.sdk.game.gameplayStart();
      }
    } catch (e) {
      console.warn('CrazyGames SDK nedostupné, hra běží bez něj.', e);
      this.ready = false;
    }
  },

  gameplayStart() {
    if (this.gameplayActive) return;
    this.gameplayActive = true;
    if (!this.ready) return;
    try { this.sdk.game.gameplayStart(); } catch (e) { /* ignorovat */ }
  },

  gameplayStop() {
    if (!this.gameplayActive) return;
    this.gameplayActive = false;
    if (!this.ready) return;
    try { this.sdk.game.gameplayStop(); } catch (e) { /* ignorovat */ }
  },

  happytime() {
    if (!this.ready) return;
    try { this.sdk.game.happytime(); } catch (e) { /* ignorovat */ }
  },

  /**
   * Midgame reklama. Během reklamy je hra pozastavená a ztlumená.
   * onDone se zavolá právě jednou (po reklamě, chybě, nebo bez SDK okamžitě).
   */
  midgameAd(onDone) {
    let finished = false;
    const done = () => {
      if (finished) return;
      finished = true;
      onDone();
    };
    const endAd = () => {
      G.adActive = false;
      Sound.setAdMuted(false);
      done();
    };
    if (!this.ready) { done(); return; }
    try {
      this.sdk.ad.requestAd('midgame', {
        adStarted: () => {
          G.adActive = true;
          Sound.setAdMuted(true);
        },
        adFinished: endAd,
        adError: (err) => {
          console.warn('Reklama selhala:', err);
          endAd();
        },
      });
    } catch (e) {
      endAd();
    }
  },
};

/* =====================================================================
 * 6. GENEROVÁNÍ LEVELU
 * ===================================================================== */

/** Obtížnost 0..1 podle pořadí planety. */
const difficulty = (n) => clamp(n / 70, 0, 1);

function pickColor(prev) {
  let c;
  do { c = PALETTE[(Math.random() * PALETTE.length) | 0]; } while (prev && c === prev.color);
  return c;
}

/** Vytvoří planetu s indexem n nad předchozí planetou prev. */
function makePlanet(n, prev) {
  const d = difficulty(n);
  let r, orbitR, gravR, angSpeed;

  if (n === 0) {
    r = 42; orbitR = r + 40; gravR = orbitR + 60; angSpeed = 1.5;
  } else {
    r = rand(lerp(30, 16, d), lerp(44, 26, d));                 // menší planety
    orbitR = r + rand(lerp(34, 26, d), lerp(46, 34, d));
    gravR = orbitR + lerp(58, 34, d);                            // menší gravitační dosah
    angSpeed = rand(lerp(1.4, 2.5, d), lerp(1.9, 3.2, d));       // rychlejší orbity
  }

  // Pohyblivé planety od 12. planety
  let amp = 0, mSpeed = 0, phase = 0;
  if (n >= 12 && Math.random() < lerp(0.12, 0.55, clamp((n - 12) / 40, 0, 1))) {
    amp = Math.min(rand(35, lerp(70, 130, d)), CFG.PLAY_W / 2 - orbitR - 40);
    mSpeed = rand(0.5, lerp(0.9, 1.5, d));
    phase = rand(0, TAU);
  }

  // Vodorovná pozice – celá orbita (i s pohybem) musí zůstat v hrací šachtě
  const maxX = Math.max(0, CFG.PLAY_W / 2 - orbitR - amp - 8);
  const x = n === 0 ? 0 : clamp(prev.baseX + rand(-270, 270), -maxX, maxX);

  // Svislá mezera – roste s obtížností, ale gravitační zóny se nikdy nepřekrývají s orbitami
  let y = 0;
  if (n > 0) {
    const gap = rand(lerp(190, 285, d), lerp(240, 360, d));
    const need = Math.max(prev.orbitR + gravR, prev.gravR + orbitR) + 14;
    y = prev.y - Math.max(gap, need);
  }

  const color = pickColor(prev);
  return {
    index: n,
    x, y, baseX: x,
    r, orbitR, gravR,
    angSpeed,
    dir: Math.random() < 0.5 ? 1 : -1,
    amp, mSpeed, phase,
    color,
    rgb: hexToRgb(color),
    style: (Math.random() * 3) | 0,            // 0 = prstenec, 1 = krátery, 2 = pruhy
    spin: rand(0, TAU),
    ringTilt: rand(-0.6, 0.6),
    craters: Array.from({ length: 4 }, () => ({ a: rand(0, TAU), d: rand(0.2, 0.7), s: rand(0.12, 0.24) })),
    dashOffset: 0,
  };
}

/** Přidá další planetu nahoru (+ případně hvězdičku a asteroidy mezi nimi). */
function generateNext() {
  const prev = G.planets[G.planets.length - 1];
  const n = G.nextIndex++;
  const p = makePlanet(n, prev);

  if (prev) {
    const d = difficulty(n);

    // --- Asteroidy (od 20. planety) v "koridoru" mezi orbitami ---
    if (n >= 20 && Math.random() < lerp(0.2, 0.6, clamp((n - 20) / 50, 0, 1))) {
      const astR = rand(11, 17);
      const needGap = prev.orbitR + p.orbitR + astR * 2 + 40;
      if (prev.y - p.y < needGap) p.y = prev.y - needGap;
      const laneY = ((prev.y - prev.orbitR) + (p.y + p.orbitR)) / 2;
      const count = d > 0.6 && Math.random() < 0.5 ? 2 : 1;
      const dirX = Math.random() < 0.5 ? 1 : -1;
      for (let i = 0; i < count; i++) {
        G.asteroids.push(makeAsteroid(rand(-CFG.PLAY_W / 2, CFG.PLAY_W / 2), laneY, i === 0 ? astR : rand(10, 15), dirX, d));
      }
    }

    // --- Bonusová hvězdička (+5) ---
    if (n >= 2 && Math.random() < 0.32) {
      for (let tries = 0; tries < 6; tries++) {
        const t = rand(0.3, 0.7);
        const dx = p.x - prev.x, dy = p.y - prev.y;
        const len = Math.hypot(dx, dy) || 1;
        const off = rand(-45, 45);
        const sx = clamp(prev.x + dx * t - (dy / len) * off, -CFG.PLAY_W / 2 + 24, CFG.PLAY_W / 2 - 24);
        const sy = prev.y + dy * t + (dx / len) * off;
        // hvězdička musí být mimo gravitační zóny, jinak by nešla sebrat
        if (Math.hypot(sx - prev.x, sy - prev.y) > prev.gravR + 16 + prev.amp &&
            Math.hypot(sx - p.x, sy - p.y) > p.gravR + 16 + p.amp) {
          G.stars.push({ x: sx, y: sy, r: 13, phase: rand(0, TAU) });
          break;
        }
      }
    }
  }

  G.planets.push(p);
}

function makeAsteroid(x, y, r, dirX, d) {
  const verts = [];
  const nv = 9;
  for (let i = 0; i < nv; i++) verts.push(rand(0.72, 1.12));
  return {
    x, y, r,
    vx: dirX * rand(lerp(70, 110, d), lerp(110, 180, d)),
    rot: rand(0, TAU),
    vrot: rand(-2, 2),
    verts,
  };
}

/** Nový svět – okamžitý restart bez načítání. */
function resetWorld() {
  G.planets.length = 0;
  G.stars.length = 0;
  G.asteroids.length = 0;
  G.particles.length = 0;
  G.texts.length = 0;
  G.trail.length = 0;
  G.nextIndex = 0;
  G.score = 0;
  G.combo = 0;
  G.lastIndex = 0;
  G.landTime = -99;
  G.quickJump = false;
  G.newBest = false;
  G.hasJumped = false;
  G.newBestShown = false;
  G.starsCollected = 0;
  G.maxMult = 1;
  G.shake = 0;
  G.scorePop = 0;
  G.comboShow = 0;
  G.time = 0;

  for (let i = 0; i < 6; i++) generateNext();

  const p0 = G.planets[0];
  const pl = G.player;
  pl.state = 'orbit';
  pl.planet = p0;
  pl.angle = Math.PI;           // start vlevo od planety
  pl.radius = p0.orbitR;
  pl.omega = p0.dir * p0.angSpeed;
  pl.exclude = null;
  pl.flightTime = 0;
  pl.x = p0.x + Math.cos(pl.angle) * pl.radius;
  pl.y = p0.y + Math.sin(pl.angle) * pl.radius;

  G.camTarget = p0.y - viewH * 0.18;
  G.camY = G.camTarget;
}


/* =====================================================================
 * 7. FYZIKA A AKTUALIZACE SVĚTA
 * ===================================================================== */

function jump() {
  const pl = G.player;
  if (pl.state !== 'orbit') return;
  const p = pl.planet;
  const s = Math.sign(pl.omega) || p.dir;
  // Tečný směr k orbitě ve směru pohybu
  const tx = -Math.sin(pl.angle) * s;
  const ty = Math.cos(pl.angle) * s;
  pl.vx = tx * CFG.FLY_SPEED;
  pl.vy = ty * CFG.FLY_SPEED;
  pl.heading = Math.atan2(pl.vy, pl.vx);
  pl.state = 'fly';
  pl.exclude = p;
  pl.flightTime = 0;
  // Rychlý skok = do COMBO_WINDOW po přistání (ne z první planety)
  G.quickJump = p.index > 0 && (G.time - G.landTime) <= CFG.COMBO_WINDOW;
  G.hasJumped = true;
  spawnBurst(pl.x, pl.y, RGB_CYAN, 8, 140, 2.4, 0.35);
  Sound.jump();
}

/** Zachycení na orbitě planety p – plynulý přechod rychlosti i poloměru. */
function capture(p) {
  const pl = G.player;
  const dx = pl.x - p.x, dy = pl.y - p.y;
  const d = Math.hypot(dx, dy) || 1;
  pl.state = 'orbit';
  pl.planet = p;
  pl.angle = Math.atan2(dy, dx);
  pl.radius = d;
  // úhlová rychlost z příletového vektoru (křížový součin / r²) → žádný skok v pohybu
  pl.omega = clamp((dx * pl.vy - dy * pl.vx) / (d * d), -8, 8);
  pl.exclude = null;
  G.landTime = G.time;
  G.camTarget = p.y - viewH * 0.18;

  spawnBurst(pl.x, pl.y, p.rgb, 20, 230, 3.2, 0.6);
  spawnRing(p);

  if (p.index > G.lastIndex) {
    // Nová planeta: +1 bod × násobič komba
    G.combo = G.quickJump ? Math.min(G.combo + 1, CFG.MAX_MULT - 1) : 0;
    const mult = 1 + G.combo;
    addScore(mult, pl.x, pl.y - 34, mult > 1 ? `+${mult}` : '+1', mult > 1 ? RGB_PINK : RGB_WHITE);
    G.maxMult = Math.max(G.maxMult, mult);
    if (mult > 1) {
      addText(pl.x, pl.y - 64, t('combo', mult), RGB_PINK, 20);
      G.comboShow = 1.6;
    }
    G.lastIndex = p.index;
    G.shake = Math.max(G.shake, 3 + G.combo * 1.5);
    Sound.land(G.combo);
  } else {
    // Návrat na starší planetu – bez bodů, kombo se ruší
    G.combo = 0;
    Sound.land(-1);
  }
}

function addScore(points, x, y, label, rgb) {
  G.score += points;
  G.scorePop = 1;
  addText(x, y, label, rgb, 28);
  // Překonání rekordu během hry – motivační hláška (jen pokud už nějaký rekord existuje)
  if (!G.newBestShown && G.best > 0 && G.score > G.best) {
    G.newBestShown = true;
    addText(x, y - 64, t('newBest'), RGB_YELLOW, 26);
    spawnBurst(x, y - 40, RGB_YELLOW, 24, 260, 3, 0.8);
    Sound.newBest();
  }
}

function collectStar(s) {
  s.dead = true;
  G.starsCollected++;
  vibrate(15);
  addScore(CFG.STAR_POINTS, s.x, s.y - 26, `+${CFG.STAR_POINTS} ★`, RGB_YELLOW);
  spawnBurst(s.x, s.y, RGB_YELLOW, 26, 280, 3, 0.7);
  G.shake = Math.max(G.shake, 6);
  Sound.star();
}

function die(reason) {
  if (G.state !== 'playing') return;
  const pl = G.player;
  G.state = 'dying';
  G.deathReason = reason;
  vibrate([40, 30, 60]);
  G.dyingTimer = CFG.DYING_TIME;
  CG.gameplayStop();
  UI.showPauseButton(false);
  // Výbuch – pokud hráč vyletěl mimo obraz, ukážeme ho na okraji
  const ex = clamp(pl.x, -boundHalf + 10, boundHalf - 10);
  const ey = clamp(pl.y, G.camY - viewH / 2 + 10, G.camY + viewH / 2 - 10);
  spawnBurst(ex, ey, RGB_WHITE, 18, 320, 3.5, 0.9);
  spawnBurst(ex, ey, RGB_CYAN, 30, 260, 3, 1.0);
  spawnBurst(ex, ey, RGB_PINK, 20, 200, 3, 1.0);
  G.shake = 18;
  Sound.lose();
}

/** Hlavní aktualizace světa (dt v sekundách). */
function update(dt) {
  if (G.adActive || G.state === 'paused') return;

  const playing = G.state === 'playing';
  G.time += dt;

  // --- Planety: rotace a pohyb ---
  for (const p of G.planets) {
    p.spin += p.dir * p.angSpeed * 0.35 * dt;
    p.dashOffset -= p.dir * p.angSpeed * p.orbitR * dt;
    if (p.amp > 0) p.x = p.baseX + Math.sin(G.time * p.mSpeed + p.phase) * p.amp;
  }

  // --- Asteroidy (obtáčejí se v hrací šachtě) ---
  const wrapX = CFG.PLAY_W / 2 + 60;
  for (const a of G.asteroids) {
    a.x += a.vx * dt;
    a.rot += a.vrot * dt;
    if (a.x > wrapX) a.x -= wrapX * 2;
    else if (a.x < -wrapX) a.x += wrapX * 2;
  }

  // --- Hráč ---
  const pl = G.player;
  if (G.state === 'menu' || playing) {
    if (pl.state === 'orbit') {
      const p = pl.planet;
      pl.omega += (p.dir * p.angSpeed - pl.omega) * smooth(5, dt);
      pl.angle += pl.omega * dt;
      pl.radius += (p.orbitR - pl.radius) * smooth(8, dt);
      pl.x = p.x + Math.cos(pl.angle) * pl.radius;
      pl.y = p.y + Math.sin(pl.angle) * pl.radius;
      pl.heading = pl.angle + (pl.omega >= 0 ? Math.PI / 2 : -Math.PI / 2);
    } else {
      pl.x += pl.vx * dt;
      pl.y += pl.vy * dt;
      pl.flightTime += dt;
      // Plamen motoru
      if (Math.random() < 0.8) {
        spawnParticle(pl.x - Math.cos(pl.heading) * 10, pl.y - Math.sin(pl.heading) * 10,
          -pl.vx * 0.15 + rand(-30, 30), -pl.vy * 0.15 + rand(-30, 30), rand(0.2, 0.4), rand(1.5, 3), RGB_ORANGE);
      }
      // Planeta, ze které hráč odletěl, ho může chytit až po opuštění její gravitační zóny
      if (pl.exclude && Math.hypot(pl.x - pl.exclude.x, pl.y - pl.exclude.y) > pl.exclude.gravR) pl.exclude = null;
      // Zachycení další planetou
      for (const p of G.planets) {
        if (p === pl.exclude) continue;
        const dx = pl.x - p.x, dy = pl.y - p.y;
        if (dx * dx + dy * dy < p.gravR * p.gravR) { capture(p); break; }
      }
      // Kamera jede jen nahoru za letící raketkou
      G.camTarget = Math.min(G.camTarget, pl.y - viewH * 0.05);
    }

    // Stopa za raketkou
    G.trail.push(pl.x, pl.y);
    if (G.trail.length > CFG.TRAIL_LEN * 2) G.trail.splice(0, 2);
  }

  // --- Kolize a prohra (jen během hry) ---
  if (playing) {
    if (pl.state === 'fly') {
      if (Math.abs(pl.x) > boundHalf + 10) die('side');
      else if (pl.y > G.camY + viewH / 2 + 25) die('bottom');
      else if (pl.flightTime > CFG.MAX_FLIGHT) die('lost');
    }
    for (const a of G.asteroids) {
      const dx = pl.x - a.x, dy = pl.y - a.y;
      const rr = a.r * 0.85 + 9;
      if (dx * dx + dy * dy < rr * rr) { die('asteroid'); break; }
    }
    for (const s of G.stars) {
      if (s.dead) continue;
      const dx = pl.x - s.x, dy = pl.y - s.y;
      const rr = s.r + 16;
      if (dx * dx + dy * dy < rr * rr) collectStar(s);
    }
  }

  // --- Animace smrti → game over ---
  if (G.state === 'dying') {
    G.dyingTimer -= dt;
    if (G.dyingTimer <= 0) finishGameOver();
  }

  // --- Kamera ---
  G.camY += (G.camTarget - G.camY) * smooth(4, dt);

  // --- Generování dopředu a úklid pod obrazovkou ---
  while (G.planets[G.planets.length - 1].y > G.camY - viewH / 2 - 700) generateNext();
  const cutY = G.camY + viewH / 2 + 500;
  if (G.planets.length && G.planets[0].y > cutY && G.planets[0] !== pl.planet) {
    G.planets = G.planets.filter((p) => p.y <= cutY || p === pl.planet);
  }
  if (G.stars.length) G.stars = G.stars.filter((s) => !s.dead && s.y < cutY);
  if (G.asteroids.length && G.asteroids[0].y > cutY) G.asteroids = G.asteroids.filter((a) => a.y < cutY);

  // --- Efekty ---
  updateParticles(dt);
  for (let i = G.texts.length - 1; i >= 0; i--) {
    const t = G.texts[i];
    t.life -= dt;
    t.y -= 40 * dt;
    if (t.life <= 0) G.texts.splice(i, 1);
  }
  for (const s of G.stars) s.phase += dt * 3;
  G.shake *= Math.exp(-8 * dt);
  if (G.shake < 0.3) G.shake = 0;
  G.scorePop *= Math.exp(-7 * dt);
  G.comboShow = Math.max(0, G.comboShow - dt);
}


/* =====================================================================
 * 8. ČÁSTICE A PLOVOUCÍ TEXTY
 * ===================================================================== */
function spawnParticle(x, y, vx, vy, life, size, rgb) {
  if (G.particles.length >= CFG.MAX_PARTICLES) return;
  G.particles.push({ x, y, vx, vy, life, max: life, size, rgb, ring: 0 });
}

function spawnBurst(x, y, rgb, count, speed, size, life) {
  for (let i = 0; i < count; i++) {
    const a = rand(0, TAU);
    const s = rand(speed * 0.3, speed);
    spawnParticle(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(life * 0.6, life), rand(size * 0.5, size), rgb);
  }
}

/** Rozpínající se kruh při přistání. */
function spawnRing(p) {
  if (G.particles.length >= CFG.MAX_PARTICLES) return;
  G.particles.push({ x: p.x, y: p.y, vx: 0, vy: 0, life: 0.5, max: 0.5, size: p.r, rgb: p.rgb, ring: 1, planet: p });
}

function updateParticles(dt) {
  const drag = Math.exp(-2.5 * dt);
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const q = G.particles[i];
    q.life -= dt;
    if (q.life <= 0) {
      G.particles[i] = G.particles[G.particles.length - 1];
      G.particles.pop();
      continue;
    }
    if (q.ring) {
      q.x = q.planet.x; q.y = q.planet.y;
    } else {
      q.vx *= drag; q.vy *= drag;
      q.x += q.vx * dt; q.y += q.vy * dt;
    }
  }
}

function addText(x, y, text, rgb, size) {
  G.texts.push({ x, y, text, rgb, size, life: 0.9, max: 0.9 });
}


/* =====================================================================
 * 9. VYKRESLOVÁNÍ
 * ===================================================================== */

/** Předrenderuje pozadí a vygeneruje parallax hvězdy (volá se při resize). */
function buildBackground() {
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = canvas.width;
  bgCanvas.height = canvas.height;
  const b = bgCanvas.getContext('2d');
  b.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = b.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a0822');
  g.addColorStop(0.55, '#060818');
  g.addColorStop(1, '#03040b');
  b.fillStyle = g;
  b.fillRect(0, 0, W, H);
  // jemné mlhoviny
  const blobs = [
    [W * 0.2, H * 0.25, Math.max(W, H) * 0.45, 'rgba(120,40,200,0.10)'],
    [W * 0.85, H * 0.6, Math.max(W, H) * 0.4, 'rgba(20,120,220,0.09)'],
    [W * 0.4, H * 0.95, Math.max(W, H) * 0.35, 'rgba(255,60,170,0.06)'],
  ];
  for (const [x, y, r, c] of blobs) {
    const rg = b.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, c);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    b.fillStyle = rg;
    b.fillRect(0, 0, W, H);
  }

  const area = clamp((W * H) / (420 * 820), 0.6, 3);
  starLayers = [
    { f: 0.05, n: Math.round(70 * area), s: [0.6, 1.2], a: 0.45 },
    { f: 0.14, n: Math.round(40 * area), s: [1.0, 1.7], a: 0.65 },
    { f: 0.3,  n: Math.round(18 * area), s: [1.5, 2.4], a: 0.9 },
  ].map((L) => ({
    ...L,
    stars: Array.from({ length: L.n }, () => ({
      x: Math.random() * W, y: Math.random() * H, s: rand(L.s[0], L.s[1]), tw: rand(0, TAU),
    })),
  }));
}

function drawParallax() {
  ctx.fillStyle = '#ffffff';
  for (const L of starLayers) {
    // pohyb kamery nahoru (camY klesá) posouvá hvězdy dolů
    const off = ((-G.camY * scale * L.f) % H + H) % H;
    for (const s of L.stars) {
      let y = s.y + off;
      if (y >= H) y -= H;
      ctx.globalAlpha = L.a * (0.65 + 0.35 * Math.sin(G.time * 2 + s.tw));
      ctx.fillRect(s.x, y, s.s, s.s);
    }
  }
  ctx.globalAlpha = 1;
}

/** Ztmavení oblasti mimo hrací šachtu (na širokých obrazovkách). */
function drawBounds() {
  if (boundHalf >= viewW / 2 - 1) return;
  const top = G.camY - viewH / 2 - 50, h = viewH + 100;
  ctx.fillStyle = 'rgba(0,0,0,0.38)';
  ctx.fillRect(-viewW / 2 - 50, top, viewW / 2 + 50 - boundHalf, h);
  ctx.fillRect(boundHalf, top, viewW / 2 + 50 - boundHalf, h);
  ctx.strokeStyle = 'rgba(57,243,255,0.16)';
  ctx.lineWidth = 2;
  ctx.setLineDash([14, 18]);
  ctx.lineDashOffset = G.camY * 0.5;
  ctx.beginPath();
  ctx.moveTo(-boundHalf, top); ctx.lineTo(-boundHalf, top + h);
  ctx.moveTo(boundHalf, top); ctx.lineTo(boundHalf, top + h);
  ctx.stroke();
  ctx.setLineDash([]);
}

/** Červené varování, když letící raketka míří k okraji hrací šachty. */
function drawEdgeWarning() {
  const pl = G.player;
  if (G.state !== 'playing' || pl.state !== 'fly') return;
  const zone = 110;
  const k = clamp((Math.abs(pl.x) - (boundHalf - zone)) / zone, 0, 1);
  if (k <= 0) return;
  const side = Math.sign(pl.x);
  const x0 = side * boundHalf;
  const g = ctx.createLinearGradient(x0, 0, x0 - side * 70, 0);
  g.addColorStop(0, `rgba(255,60,60,${0.45 * k})`);
  g.addColorStop(1, 'rgba(255,60,60,0)');
  ctx.fillStyle = g;
  const x = side > 0 ? x0 - 70 : x0;
  ctx.fillRect(x, G.camY - viewH / 2 - 50, 70, viewH + 100);
}

function drawPlanet(p) {
  const c = p.rgb;
  const isCurrent = G.player.planet === p && G.player.state === 'orbit';

  // Gravitační zóna
  const gz = ctx.createRadialGradient(p.x, p.y, p.orbitR, p.x, p.y, p.gravR);
  gz.addColorStop(0, rgba(c, 0.0));
  gz.addColorStop(1, rgba(c, 0.07));
  ctx.fillStyle = gz;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.gravR, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(c, 0.12);
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Orbita – animované čárky ukazují směr a rychlost rotace
  ctx.strokeStyle = rgba(c, isCurrent ? 0.55 : 0.35);
  ctx.lineWidth = 2;
  ctx.setLineDash([7, 11]);
  ctx.lineDashOffset = p.dashOffset;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.orbitR, 0, TAU);
  ctx.stroke();
  ctx.setLineDash([]);

  // Záře
  const glow = ctx.createRadialGradient(p.x, p.y, p.r * 0.7, p.x, p.y, p.r * 2.3);
  glow.addColorStop(0, rgba(c, 0.35));
  glow.addColorStop(1, rgba(c, 0));
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r * 2.3, 0, TAU);
  ctx.fill();

  // Zadní polovina prstence
  if (p.style === 0) drawRing(p, Math.PI, TAU);

  // Tělo planety
  const body = ctx.createRadialGradient(p.x - p.r * 0.35, p.y - p.r * 0.35, p.r * 0.1, p.x, p.y, p.r);
  body.addColorStop(0, rgba(c, 0.55));
  body.addColorStop(1, 'rgba(8,10,28,1)');
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r, 0, TAU);
  ctx.fill();

  // Detaily povrchu (oříznuté do kruhu)
  if (p.style !== 0) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r - 1, 0, TAU);
    ctx.clip();
    ctx.strokeStyle = rgba(c, 0.45);
    ctx.lineWidth = 1.5;
    if (p.style === 1) {
      for (const k of p.craters) {
        const a = k.a + p.spin;
        ctx.beginPath();
        ctx.arc(p.x + Math.cos(a) * p.r * k.d, p.y + Math.sin(a) * p.r * k.d * 0.8, p.r * k.s, 0, TAU);
        ctx.stroke();
      }
    } else {
      for (let i = -2; i <= 2; i++) {
        const yy = p.y + i * p.r * 0.36 + Math.sin(p.spin + i) * 2;
        ctx.beginPath();
        ctx.moveTo(p.x - p.r, yy);
        ctx.quadraticCurveTo(p.x, yy + Math.sin(p.spin * 2 + i) * 5, p.x + p.r, yy);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // Neonový okraj
  ctx.strokeStyle = rgba(c, 0.95);
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r, 0, TAU);
  ctx.stroke();

  // Přední polovina prstence
  if (p.style === 0) drawRing(p, 0, Math.PI);
}

function drawRing(p, a0, a1) {
  ctx.strokeStyle = rgba(p.rgb, 0.75);
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, p.r * 1.75, p.r * 0.45, p.ringTilt, a0, a1);
  ctx.stroke();
}

function drawStarShape(x, y, rOuter, rInner, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? rInner : rOuter;
    const a = rot + (i * Math.PI) / 5 - Math.PI / 2;
    if (i === 0) ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    else ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
}

function drawCollectible(s) {
  const bob = Math.sin(s.phase) * 4;
  const y = s.y + bob;
  const pulse = 1 + Math.sin(s.phase * 1.7) * 0.12;
  const g = ctx.createRadialGradient(s.x, y, 0, s.x, y, s.r * 3);
  g.addColorStop(0, 'rgba(255,228,92,0.45)');
  g.addColorStop(1, 'rgba(255,228,92,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s.x, y, s.r * 3, 0, TAU);
  ctx.fill();
  drawStarShape(s.x, y, s.r * pulse, s.r * 0.45 * pulse, s.phase * 0.4);
  ctx.fillStyle = '#fff6b8';
  ctx.fill();
  ctx.strokeStyle = '#ffe45c';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawAsteroid(a) {
  const g = ctx.createRadialGradient(a.x, a.y, a.r * 0.5, a.x, a.y, a.r * 2);
  g.addColorStop(0, 'rgba(255,90,50,0.22)');
  g.addColorStop(1, 'rgba(255,90,50,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(a.x, a.y, a.r * 2, 0, TAU);
  ctx.fill();

  ctx.beginPath();
  const n = a.verts.length;
  for (let i = 0; i < n; i++) {
    const ang = a.rot + (i / n) * TAU;
    const rr = a.r * a.verts[i];
    if (i === 0) ctx.moveTo(a.x + Math.cos(ang) * rr, a.y + Math.sin(ang) * rr);
    else ctx.lineTo(a.x + Math.cos(ang) * rr, a.y + Math.sin(ang) * rr);
  }
  ctx.closePath();
  ctx.fillStyle = '#1a0e14';
  ctx.fill();
  ctx.strokeStyle = '#ff6a3d';
  ctx.lineWidth = 2.2;
  ctx.stroke();
}

function drawTrail() {
  const t = G.trail;
  const n = t.length / 2;
  if (n < 2) return;
  ctx.lineCap = 'round';
  for (let i = 1; i < n; i++) {
    const k = i / n;
    ctx.strokeStyle = rgba(RGB_CYAN, k * 0.55);
    ctx.lineWidth = 1 + k * 5;
    ctx.beginPath();
    ctx.moveTo(t[(i - 1) * 2], t[(i - 1) * 2 + 1]);
    ctx.lineTo(t[i * 2], t[i * 2 + 1]);
    ctx.stroke();
  }
  ctx.lineCap = 'butt';
}

function drawPlayer() {
  const pl = G.player;

  // Nápověda směru odletu (tečna) – krátká tečkovaná čára
  if (pl.state === 'orbit' && (G.state === 'playing' || G.state === 'menu')) {
    const s = Math.sign(pl.omega) || 1;
    const tx = -Math.sin(pl.angle) * s, ty = Math.cos(pl.angle) * s;
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 2;
    ctx.setLineDash([3, 7]);
    ctx.beginPath();
    ctx.moveTo(pl.x + tx * 18, pl.y + ty * 18);
    ctx.lineTo(pl.x + tx * 70, pl.y + ty * 70);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Ukazatel okna pro kombo (zmenšující se oblouk)
  if (G.state === 'playing' && pl.state === 'orbit' && pl.planet.index > 0) {
    const left = 1 - (G.time - G.landTime) / CFG.COMBO_WINDOW;
    if (left > 0) {
      ctx.strokeStyle = rgba(RGB_PINK, 0.85);
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(pl.x, pl.y, 22, -Math.PI / 2, -Math.PI / 2 + TAU * left);
      ctx.stroke();
    }
  }

  // Záře
  const g = ctx.createRadialGradient(pl.x, pl.y, 0, pl.x, pl.y, 30);
  g.addColorStop(0, 'rgba(57,243,255,0.45)');
  g.addColorStop(1, 'rgba(57,243,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(pl.x, pl.y, 30, 0, TAU);
  ctx.fill();

  ctx.save();
  ctx.translate(pl.x, pl.y);
  ctx.rotate(pl.heading);

  // Plamen
  const flame = (pl.state === 'fly' ? 16 : 7) * (0.75 + Math.random() * 0.5);
  ctx.fillStyle = 'rgba(255,150,60,0.9)';
  ctx.beginPath();
  ctx.moveTo(-8, -4.5);
  ctx.lineTo(-8 - flame, 0);
  ctx.lineTo(-8, 4.5);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(255,240,180,0.95)';
  ctx.beginPath();
  ctx.moveTo(-8, -2.2);
  ctx.lineTo(-8 - flame * 0.5, 0);
  ctx.lineTo(-8, 2.2);
  ctx.closePath();
  ctx.fill();

  // Trup
  ctx.beginPath();
  ctx.moveTo(15, 0);
  ctx.lineTo(-10, -9);
  ctx.lineTo(-5, 0);
  ctx.lineTo(-10, 9);
  ctx.closePath();
  ctx.fillStyle = '#eafdff';
  ctx.fill();
  ctx.strokeStyle = '#39f3ff';
  ctx.lineWidth = 2.2;
  ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.restore();
}

function drawParticles() {
  ctx.globalCompositeOperation = 'lighter';
  for (const q of G.particles) {
    const k = q.life / q.max;
    if (q.ring) {
      ctx.strokeStyle = rgba(q.rgb, k * 0.8);
      ctx.lineWidth = 3 * k + 0.5;
      ctx.beginPath();
      ctx.arc(q.x, q.y, q.size + (1 - k) * q.size * 1.6, 0, TAU);
      ctx.stroke();
    } else {
      ctx.fillStyle = rgba(q.rgb, k);
      ctx.beginPath();
      ctx.arc(q.x, q.y, q.size * (0.4 + 0.6 * k), 0, TAU);
      ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawTexts() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const t of G.texts) {
    const k = t.life / t.max;
    const sc = 1 + (1 - Math.min(1, (1 - k) * 6)) * 0.5;   // "pop" na začátku
    ctx.font = `900 ${Math.round(t.size * sc)}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
    ctx.fillStyle = rgba(t.rgb, Math.min(1, k * 1.8));
    ctx.fillText(t.text, t.x, t.y);
  }
}

/** HUD kreslený v pixelech obrazovky (skóre, kombo, nápověda). */
function drawHUD() {
  if (G.state !== 'playing' && G.state !== 'paused' && G.state !== 'dying') return;
  const base = clamp(H * 0.065, 34, 68);
  const top = base * 0.9 + 12;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Skóre s "pop" efektem
  const sc = 1 + G.scorePop * 0.35;
  ctx.save();
  ctx.translate(W / 2, top);
  ctx.scale(sc, sc);
  ctx.font = `900 ${Math.round(base)}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
  ctx.shadowColor = '#39f3ff';
  ctx.shadowBlur = 16;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(String(G.score), 0, 0);
  ctx.restore();

  // Aktuální násobič
  if (G.combo > 0) {
    const a = 0.75 + 0.25 * Math.sin(G.time * 10) * Math.min(1, G.comboShow);
    ctx.font = `800 ${Math.round(base * 0.36)}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
    ctx.fillStyle = rgba(RGB_PINK, a);
    ctx.fillText(t('combo', G.combo + 1), W / 2, top + base * 0.75);
  }

  // Nápověda na začátku
  if (G.state === 'playing' && !G.hasJumped) {
    ctx.font = `700 ${Math.round(clamp(H * 0.028, 15, 24))}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
    ctx.fillStyle = `rgba(255,228,92,${0.6 + 0.4 * Math.sin(G.time * 5)})`;
    ctx.fillText(t('launchHint'), W / 2, H - Math.max(60, H * 0.1));
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawParallax();

  // Přepnutí do světových souřadnic (kamera + screen shake)
  const sx = G.shake ? (Math.random() * 2 - 1) * G.shake : 0;
  const sy = G.shake ? (Math.random() * 2 - 1) * G.shake : 0;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (W / 2 + sx), dpr * (H / 2 + sy));
  ctx.translate(0, -G.camY);

  drawBounds();
  drawEdgeWarning();
  const vTop = G.camY - viewH / 2, vBot = G.camY + viewH / 2;
  for (const p of G.planets) {
    if (p.y + p.gravR < vTop || p.y - p.gravR > vBot) continue;
    drawPlanet(p);
  }
  for (const s of G.stars) if (s.y > vTop - 40 && s.y < vBot + 40) drawCollectible(s);
  for (const a of G.asteroids) if (a.y > vTop - 40 && a.y < vBot + 40) drawAsteroid(a);
  if (G.state !== 'dying' && G.state !== 'over') {
    drawTrail();
    drawPlayer();
  }
  drawParticles();
  drawTexts();

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawHUD();
}


/* =====================================================================
 * 10. UI A STAVY HRY
 * ===================================================================== */
const $ = (id) => document.getElementById(id);
const ICON_SOUND_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_SOUND_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6"/></svg>';

const UI = {
  updateSoundIcon() {
    const b = $('btnSound');
    const off = Sound.userMuted;
    b.innerHTML = off ? ICON_SOUND_OFF : ICON_SOUND_ON;
    b.title = t(off ? 'soundOff' : 'soundOn');
    b.setAttribute('aria-label', b.title);
  },
  showPauseButton(v) { $('btnPause').classList.toggle('hidden', !v); },
  show(id, v) { $(id).classList.toggle('hidden', !v); },
  updateMenuBest() {
    $('menuBest').textContent = G.best > 0 ? t('bestScore', G.best) : '';
  },
};

function startGame() {
  resetWorld();
  G.state = 'playing';
  G.overlayReady = false;
  UI.show('menu', false);
  UI.show('gameover', false);
  UI.show('pause', false);
  UI.showPauseButton(true);
  CG.gameplayStart();
}

function pauseGame() {
  if (G.state !== 'playing') return;
  G.state = 'paused';
  UI.show('pause', true);
  UI.showPauseButton(false);
  CG.gameplayStop();
}

function resumeGame() {
  if (G.state !== 'paused' || G.adActive) return;
  G.state = 'playing';
  UI.show('pause', false);
  UI.showPauseButton(true);
  CG.gameplayStart();
}

function finishGameOver() {
  G.state = 'over';
  G.deaths++;
  G.newBest = G.score > G.best;
  if (G.newBest) {
    G.best = G.score;
    Store.set(CFG.STORAGE_BEST, G.best);
    CG.happytime();
  }
  const showScreen = () => {
    $('goScore').textContent = G.score;
    $('goBest').textContent = t('best', G.best);
    $('goReason').textContent = t('reason_' + G.deathReason);
    $('goPlanets').textContent = G.lastIndex;
    $('goStars').textContent = G.starsCollected;
    $('goCombo').textContent = 'x' + G.maxMult;
    UI.show('goRecord', G.newBest);
    UI.show('gameover', true);
    G.overlayReady = true;
  };
  if (G.deaths % CFG.MIDGAME_EVERY === 0) CG.midgameAd(showScreen);
  else showScreen();
}


/* =====================================================================
 * 11. VSTUP (myš, dotyk, klávesnice) a automatická pauza
 * ===================================================================== */
function onPress() {
  Sound.unlock();
  if (G.adActive) return;
  switch (G.state) {
    case 'menu': Sound.click(); startGame(); break;
    case 'playing': jump(); break;
    case 'paused': resumeGame(); break;
    default: break;
  }
}

canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); onPress(); });
$('menu').addEventListener('pointerdown', (e) => { e.preventDefault(); onPress(); });
$('pause').addEventListener('pointerdown', (e) => { e.preventDefault(); Sound.unlock(); resumeGame(); });

$('btnPause').addEventListener('click', (e) => { e.currentTarget.blur(); Sound.unlock(); pauseGame(); });
$('btnSound').addEventListener('click', (e) => {
  e.currentTarget.blur();
  Sound.unlock();
  Sound.toggleUserMute();
  Sound.click();
});
$('btnRestart').addEventListener('click', (e) => {
  e.currentTarget.blur();
  Sound.unlock();
  if (G.state === 'over' && G.overlayReady && !G.adActive) { Sound.click(); startGame(); }
});

window.addEventListener('keydown', (e) => {
  const k = e.code;
  if (k === 'Space' || k === 'ArrowUp' || k === 'Enter') {
    e.preventDefault();
    if (e.repeat) return;
    if (G.state === 'over') {
      if (G.overlayReady && !G.adActive) { Sound.unlock(); startGame(); }
    } else {
      onPress();
    }
  } else if (k === 'Escape' || k === 'KeyP') {
    if (G.state === 'playing') pauseGame();
    else if (G.state === 'paused') resumeGame();
  } else if (k === 'KeyM') {
    Sound.unlock();
    Sound.toggleUserMute();
  }
});

// iOS: AudioContext se někdy odemkne až při touchend/click
['touchend', 'click'].forEach((ev) => window.addEventListener(ev, () => Sound.unlock(), { passive: true }));

// Zákaz zoomu, scrollování a kontextového menu
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

// Automatická pauza při ztrátě fokusu / skrytí stránky
window.addEventListener('blur', pauseGame);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    pauseGame();
    try { if (Sound.ctx) Sound.ctx.suspend(); } catch (e) { /* ignorovat */ }
  } else {
    try { if (Sound.ctx) Sound.ctx.resume(); } catch (e) { /* ignorovat */ }
  }
});


/* =====================================================================
 * 12. RESPONZIVITA
 * ===================================================================== */
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.max(1, Math.round(W * dpr));
  canvas.height = Math.max(1, Math.round(H * dpr));
  // Měřítko: vždy je vidět celá šířka šachty a aspoň VIEW_H na výšku
  scale = Math.min(W / CFG.PLAY_W, H / CFG.VIEW_H);
  viewW = W / scale;
  viewH = H / scale;
  boundHalf = Math.min(viewW / 2, CFG.PLAY_W / 2 + 50);
  buildBackground();
  // udržet hráče na stejném místě obrazovky
  if (G.player.planet && G.player.state === 'orbit') {
    G.camTarget = G.player.planet.y - viewH * 0.18;
    G.camY = G.camTarget;
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));


/* =====================================================================
 * 13. HERNÍ SMYČKA (requestAnimationFrame + delta time)
 * ===================================================================== */
let lastTime = performance.now();

function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  // Omezení dt (přepnutí záložky, zásek) – fyzika zůstane stabilní
  if (dt > 1 / 20) dt = 1 / 20;
  if (dt < 0) dt = 0;
  update(dt);
  render();
}


/* =====================================================================
 * 14. START
 * ===================================================================== */
(async function boot() {
  resize();
  resetWorld();
  setLanguage(URL_LANG || 'en');
  UI.updateSoundIcon();
  UI.updateMenuBest();
  requestAnimationFrame((t) => { lastTime = t; frame(t); });
  await CG.init();
})();
</script>
