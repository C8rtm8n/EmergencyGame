<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ztroskotanec</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #120d18;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  canvas { position: absolute; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
  #crt { visibility: hidden; }
  #rotate { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    background: #1a1423; color: #ecd9a8; font: bold 18px monospace; text-align: center; z-index: 5; }
  #rotate .phone { width: 40px; height: 70px; border: 4px solid #ecd9a8; border-radius: 6px; margin-bottom: 16px; animation: rot 2s infinite; }
  @keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
</style>
<!-- CrazyGames SDK v3 (optional: the game runs without it) -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
</head>
<body>
<canvas id="screen"></canvas>
<canvas id="crt"></canvas>
<div id="rotate"><div class="phone"></div><div>OTOČ ZAŘÍZENÍ<br>ROTATE DEVICE</div></div>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/font.js"></script>
<script src="js/sdk.js"></script>
<script src="js/save.js"></script>
<script src="js/audio.js"></script>
<script src="js/sprites.js"></script>
<script src="js/bg.js"></script>
<script src="js/levels.js"></script>
<script src="js/world.js"></script>
<script src="js/levelgfx.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script src="js/scenes.js"></script>
<script src="js/cutscenes.js"></script>
<script src="js/main.js"></script>
</body>
</html>
